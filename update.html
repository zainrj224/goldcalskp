<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Rate Update — Rajput Jewellers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<style>
  :root{
    --bg:#f3efe6;--card:#ffffff;--text:#2b1608;--muted:#7a6a55;--border:#e4d9bf;
    --gold:#b8860b;--gold-soft:#fff3b0;--green:#1f9d63;--red:#d6343a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Verdana,'Segoe UI',Tahoma,sans-serif;min-height:100vh;
       display:flex;justify-content:center;padding:18px;}
  .wrap{width:100%;max-width:460px;}
  .brand{text-align:center;margin:6px 0 16px;}
  .brand .crown{font-size:34px;line-height:1;}
  .brand h1{margin:6px 0 2px;font-size:20px;color:var(--gold);}
  .brand p{margin:0;font-size:12px;color:var(--muted);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 6px 18px rgba(80,50,10,.07);}
  label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px;}
  label small{font-weight:400;color:var(--muted);}
  input[type=password],input[type=number],input[type=date]{
    width:100%;padding:15px 14px;font-size:20px;font-weight:700;border:1.5px solid var(--border);border-radius:12px;
    background:#fffdf7;color:var(--text);}
  input:focus{outline:none;border-color:var(--gold);}
  input[type=password]{font-size:18px;}
  button.main{width:100%;margin-top:20px;padding:17px;font-size:18px;font-weight:800;border:none;border-radius:12px;
    background:var(--gold);color:#fff;cursor:pointer;}
  button.main:active{transform:scale(.99);}
  button.main:disabled{opacity:.6;}
  .msg{margin-top:14px;font-size:14px;font-weight:700;text-align:center;min-height:20px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
  .datebar{display:flex;justify-content:space-between;align-items:center;background:var(--gold-soft);border:1px solid #ecd57a;
    border-radius:12px;padding:12px 14px;}
  .datebar b{font-size:16px;} .datebar span{font-size:11px;color:var(--muted);display:block;}
  .link{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;}
  .current{font-size:12px;color:var(--muted);margin-top:8px;}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  th{font-size:11px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--border);font-weight:700;}
  td{padding:8px 4px;border-bottom:1px dashed var(--border);}
  td.num,th.num{text-align:right;}
  tr.sel td{background:#fff9e0;font-weight:800;}
  .hint{font-size:11px;color:var(--muted);margin-top:16px;text-align:center;}
  .hidden{display:none;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="crown">👑</div>
    <h1>Daily Rate Update</h1>
    <p>Rajput Jewellers</p>
  </div>

  <!-- step 1: passcode -->
  <div class="card" id="loginCard">
    <label for="pass" style="margin-top:0;">Passcode</label>
    <input type="password" id="pass" placeholder="Passcode likhein" autocomplete="current-password">
    <button class="main" id="loginBtn" type="button">Open</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- step 2: enter the new rate -->
  <div class="card hidden" id="rateCard">
    <div class="datebar">
      <div><span>Rate is date ka lagega</span><b id="dateLabel">--</b></div>
      <button class="link" id="changeDateBtn" type="button">Date badlein</button>
    </div>
    <div id="dateBox" class="hidden">
      <label for="dateInput" style="margin-top:12px;">Date chunein</label>
      <input type="date" id="dateInput">
    </div>
    <div class="current" id="currentNote"></div>

    <label for="rate24">24K Tola Rate <small>(PKR)</small></label>
    <input type="number" id="rate24" inputmode="numeric" placeholder="e.g. 392000">

    <label for="silver">Silver Rate <small>(PKR / tola — optional)</small></label>
    <input type="number" id="silver" inputmode="numeric" placeholder="khali chhorein to wahi rahega">

    <button class="main" id="saveBtn" type="button">Save Rate</button>
    <div class="msg" id="saveMsg"></div>

    <div style="margin-top:18px;font-size:12px;font-weight:700;">Pichle 7 din</div>
    <table>
      <thead><tr><th>Date</th><th class="num">24K Tola</th><th class="num">Silver</th></tr></thead>
      <tbody id="daysBody"></tbody>
    </table>
    <div class="hint">Isi date par dobara save karenge to purana rate badal jayega.<br>Website ka graph khud update ho jata hai.</div>
    <div class="top" style="margin-top:14px;justify-content:center;">
      <button class="link" id="logoutBtn" type="button">Bahar niklein</button>
    </div>
  </div>
</div>

<script>
  const API = '/.netlify/functions/daily-rate';
  const PASS_KEY = 'gc_rate_pass';
  let pass = '';
  let today = '';
  let selectedDate = '';

  const $ = (id) => document.getElementById(id);
  const num = (n) => (n == null ? '--' : Number(n).toLocaleString('en-PK', { maximumFractionDigits: 0 }));

  function niceDate(iso){
    const d = new Date(iso + 'T00:00:00Z');
    const s = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    return iso === today ? 'Aaj — ' + s : s;
  }

  async function call(method, query, body){
    const res = await fetch(API + (query || ''), {
      method: method,
      headers: Object.assign({ 'x-admin-pass': pass }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    });
    const data = await res.json().catch(function(){ return {}; });
    return { status: res.status, ok: res.ok, data: data };
  }

  function renderDays(days){
    $('daysBody').innerHTML = (days || []).slice().reverse().map(function(d){
      return '<tr class="' + (d.date === selectedDate ? 'sel' : '') + '"><td>' + d.label + ' ' + d.date.slice(8) + '/' + d.date.slice(5, 7) +
        '</td><td class="num">' + num(d.rate) + '</td><td class="num">' + (d.silver > 0 ? num(d.silver) : '--') + '</td></tr>';
    }).join('');
  }

  function fillSelected(sel){
    $('dateLabel').textContent = niceDate(selectedDate);
    $('rate24').value = sel && sel.rate > 0 ? sel.rate : '';
    $('silver').value = sel && sel.silver > 0 ? sel.silver : '';
    $('currentNote').textContent = sel && sel.recorded
      ? 'Is date ka rate pehle se save hai — naya daalenge to badal jayega.'
      : (sel && sel.rate > 0 ? 'Is date ka rate abhi save nahi hua (pichla rate dikh raha hai).' : 'Is date ka rate abhi save nahi hua.');
  }

  async function open(){
    const r = await call('GET', '');
    if(r.status === 401){ return false; }
    if(!r.ok){ $('loginMsg').textContent = 'Server error — dobara koshish karein.'; $('loginMsg').className = 'msg err'; return null; }
    today = r.data.today;
    selectedDate = today;
    $('dateInput').max = today;
    $('dateInput').value = today;
    $('loginCard').classList.add('hidden');
    $('rateCard').classList.remove('hidden');
    fillSelected(r.data.selected);
    renderDays(r.data.days);
    return true;
  }

  $('loginBtn').addEventListener('click', async function(){
    pass = $('pass').value.trim();
    if(!pass){ return; }
    $('loginBtn').disabled = true;
    $('loginMsg').textContent = '';
    const ok = await open();
    $('loginBtn').disabled = false;
    if(ok === true){
      try { localStorage.setItem(PASS_KEY, pass); } catch(e) {}
    } else if(ok === false){
      $('loginMsg').textContent = 'Passcode ghalat hai.';
      $('loginMsg').className = 'msg err';
    }
  });
  $('pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('loginBtn').click(); });

  $('changeDateBtn').addEventListener('click', function(){ $('dateBox').classList.toggle('hidden'); });
  $('dateInput').addEventListener('change', async function(){
    const v = $('dateInput').value;
    if(!v){ return; }
    selectedDate = v;
    const r = await call('GET', '?date=' + encodeURIComponent(v));
    if(r.ok){ fillSelected(r.data.selected); renderDays(r.data.days); $('saveMsg').textContent = ''; }
  });

  $('saveBtn').addEventListener('click', async function(){
    const msg = $('saveMsg');
    const rate = parseFloat($('rate24').value);
    if(!isFinite(rate) || rate <= 0){
      msg.textContent = 'Pehle 24K tola rate daalein.';
      msg.className = 'msg err';
      return;
    }
    $('saveBtn').disabled = true;
    msg.textContent = 'Save ho raha hai...';
    msg.className = 'msg';
    const silverRaw = $('silver').value.trim();
    const r = await call('POST', '', { date: selectedDate, rate: rate, silver: silverRaw === '' ? '' : parseFloat(silverRaw) });
    $('saveBtn').disabled = false;
    if(r.status === 401){ msg.textContent = 'Passcode ab sahi nahi — dobara open karein.'; msg.className = 'msg err'; return; }
    if(!r.ok){ msg.textContent = r.data.error || 'Save nahi ho saka.'; msg.className = 'msg err'; return; }
    msg.textContent = '✔ Save ho gaya — ' + niceDate(r.data.date) + ': ' + num(r.data.rate) + (r.data.live ? ' (website par live)' : ' (purani date — live rate nahi badla)');
    msg.className = 'msg ok';
    $('currentNote').textContent = 'Is date ka rate pehle se save hai — naya daalenge to badal jayega.';
    renderDays(r.data.days);
  });

  $('logoutBtn').addEventListener('click', function(){
    try { localStorage.removeItem(PASS_KEY); } catch(e) {}
    pass = '';
    $('pass').value = '';
    $('rateCard').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
  });

  // remembered on this phone: open straight to the rate box
  (async function autoOpen(){
    let saved = '';
    try { saved = localStorage.getItem(PASS_KEY) || ''; } catch(e) {}
    if(!saved) return;
    pass = saved;
    const ok = await open();
    if(ok !== true){ try { localStorage.removeItem(PASS_KEY); } catch(e) {} pass = ''; }
  })();
</script>
</body>
</html>
